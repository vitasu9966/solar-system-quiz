  </style>
</head>
<body>
  <div class="shell">

          <button class="secondary" id="reveal" disabled>查看答案</button>

        : groups.filter(group => group.code === categorySelect.value);
      remaining = selectedGroups.flatMap(group => group.items.map(([question, answer], index) => ({
        code: group.code, name: group.name, number: index + 1, question, answer
      })));
    }

    function drawQuestion() {
      if (remaining.length === 0) resetPool();
      const index = Math.floor(Math.random() * remaining.length);
      currentQuestion = remaining.splice(index, 1)[0];
      questionEl.textContent = currentQuestion.question;
      answerEl.textContent = `答案：${currentQuestion.answer}`;
      answerEl.hidden = true;
      metaEl.textContent = `${currentQuestion.code}${currentQuestion.number}　/　${currentQuestion.name}`;
      revealButton.disabled = false;
      nextButton.disabled = false;
      statusEl.textContent = `本輪還有 ${remaining.length} 題未探索。`;
    }

    function startOver() {
      categorySelect.value = "all";
      resetPool();
      currentQuestion = null;
      questionEl.textContent = "按下「開始抽題」，展開你的宇宙探索。";
      metaEl.textContent = "MISSION READY";
      answerEl.hidden = true;
      revealButton.disabled = true;
      nextButton.disabled = true;
      statusEl.textContent = "已重設：全部 115 題尚未抽取。";
    }

    document.querySelector("#draw").addEventListener("click", drawQuestion);
    nextButton.addEventListener("click", drawQuestion);
    resetButton.addEventListener("click", startOver);
    revealButton.addEventListener("click", () => {
      if (!currentQuestion) return;
      answerEl.hidden = false;
      revealButton.disabled = true;
    });
    categorySelect.addEventListener("change", () => {
      resetPool();
      currentQuestion = null;
      questionEl.textContent = "按下「開始抽題」，展開你的宇宙探索。";
      metaEl.textContent = "MISSION READY";
      answerEl.hidden = true;
      revealButton.disabled = true;
      nextButton.disabled = true;
      const count = remaining.length;
      statusEl.textContent = categorySelect.value === "all"
        ? `全部 ${count} 題尚未抽取。`
        : `此分類 ${count} 題尚未抽取。`;
    });
    resetPool();
  </script>
</body>
</html>
